name: Build and Deploy (iOS IPA, Android APK & GitHub Pages)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Deploy All Platforms
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      # 1. Build Web & Deploy to GitHub Pages
      - name: Build Flutter Web
        run: flutter build web --release --base-href "/notetaking-flutter/"

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

      # 2. Build Android APK
      - name: Build Android Release APK
        run: flutter build apk --release

      # 3. Build iOS IPA without code signing
      - name: Build iOS IPA
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 GhiChu.ipa Payload

      # 4. Automatically Update GitHub Release
      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Bản phát hành Ghi chú mới nhất (Tự động cập nhật)"
          body: |
            ## 🎉 Bản cập nhật mới nhất của ứng dụng Ghi chú
            Hệ thống tự động biên dịch và cập nhật mỗi khi có mã nguồn mới!
            
            - 📱 **GhiChu.ipa**: Dành cho iPhone 12 (Cài đặt qua Sideloadly, AltStore, Scarlet)
            - 🤖 **app-release.apk**: Dành cho điện thoại Android
            - 🌐 **Web App iPhone**: [https://khanhken159.github.io/notetaking-flutter/](https://khanhken159.github.io/notetaking-flutter/)
          files: |
            GhiChu.ipa
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
